
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | BlogSpace</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>
<body class="auth-page">

    <header class="navbar">
        <a href="index.html" class="logo">BlogSpace<span>.</span></a>
        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="register.html" class="btn btn-small">Create Account</a>
        </nav>
    </header>

    <main class="auth-container">
        <section class="auth-card">

            <a href="login.html" class="back-link">← Back to Login</a>

            <div class="auth-heading">
                <p class="eyebrow">PASSWORD RECOVERY</p>
                <h1>Forgot your password?</h1>
                <p>No worries! Enter your registered email address and we'll send you a password reset link.</p>
            </div>

            <form id="forgotPasswordForm" novalidate>

                <div class="form-group">
                    <label for="forgotEmail">Email Address</label>
                    <input
                        type="email"
                        id="forgotEmail"
                        placeholder="you@example.com"
                        required
                    >
                    <small class="error-message" id="forgotEmailError"></small>
                </div>

                <button type="submit" class="btn auth-submit">
                    Send Reset Link
                </button>

                <p id="forgotPasswordMessage"
                   class="form-message"
                   aria-live="polite"></p>

            </form>

            <p class="auth-switch">
                Remember your password?
                <a href="login.html">Login here</a>
            </p>

        </section>
    </main>

    <footer class="footer">
        <a href="index.html" class="logo">BlogSpace<span>.</span></a>
        <p>© 2026 BlogSpace. Built for curious minds.</p>
    </footer>

</body>
</html>
