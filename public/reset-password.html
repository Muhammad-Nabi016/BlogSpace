
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | BlogSpace</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>
<body class="auth-page">

    <header class="navbar">
        <a href="index.html" class="logo">BlogSpace<span>.</span></a>
        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="login.html" class="btn btn-small">Login</a>
        </nav>
    </header>

    <main class="auth-container">
        <section class="auth-card">

            <a href="login.html" class="back-link">← Back to Login</a>

            <div class="auth-heading">
                <p class="eyebrow">PASSWORD RECOVERY</p>
                <h1>Create a new password</h1>
                <p>Enter your new password below to regain access to your account.</p>
            </div>

            <form id="resetPasswordForm" novalidate>

                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <input
                        type="password"
                        id="newPassword"
                        placeholder="Enter new password"
                        required
                    >
                    <small class="error-message" id="newPasswordError"></small>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm New Password</label>
                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm new password"
                        required
                    >
                    <small class="error-message" id="confirmPasswordError"></small>
                </div>

                <button type="submit" class="btn auth-submit">
                    Reset Password
                </button>

                <p id="resetPasswordMessage"
                   class="form-message"
                   aria-live="polite"></p>

            </form>

        </section>
    </main>

    <footer class="footer">
        <a href="index.html" class="logo">BlogSpace<span>.</span></a>
        <p>© 2026 BlogSpace. Built for curious minds.</p>
    </footer>

</body>
</html>
